<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080b14">
<title>TradeFlow — Journal</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ── Reset & Variables ───────────────────────────────── */
:root{
  --bg:#080b14; --bg2:#0d1221; --bg3:#111827;
  --card:rgba(255,255,255,.04); --card2:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12);
  --a1:#3b82f6; --a2:#06b6d4;
  --grad:linear-gradient(135deg,#3b82f6,#06b6d4);
  --grad2:linear-gradient(135deg,#1d4ed8,#0891b2);
  --green:#10b981; --green2:rgba(16,185,129,.15);
  --red:#ef4444; --red2:rgba(239,68,68,.15);
  --amber:#f59e0b;
  --text:#f1f5f9; --sub:#64748b; --sub2:#94a3b8;
  --font:'Outfit',sans-serif; --font2:'DM Sans',sans-serif;
  --r:16px; --r2:24px; --r3:32px;
  --shadow:0 8px 32px rgba(0,0,0,.4);
  --glow:0 0 40px rgba(59,130,246,.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:var(--font);color:var(--text);max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative;}
button{font-family:var(--font);cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:var(--font);outline:none;}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.5);}

/* ── Scrollbar ───────────────────────────────────────── */
::-webkit-scrollbar{width:0;height:0;}

/* ── App Shell ───────────────────────────────────────── */
#app{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
#nav{flex-shrink:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;background:none;border:none;color:var(--sub);font-size:10px;font-weight:500;letter-spacing:.3px;transition:color .2s;}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s;}
.nav-item.active{color:var(--a1);}
.nav-item.active svg{stroke:var(--a1);}

/* ── Splash ──────────────────────────────────────────── */
#splash{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;max-width:430px;margin:0 auto;}
.orb{position:absolute;border-radius:50%;filter:blur(1px);}
.orb1{width:280px;height:280px;top:-60px;right:-40px;background:conic-gradient(from 180deg,#3b82f6,#06b6d4,#3b82f6);animation:spin 12s linear infinite;}
.orb2{width:200px;height:200px;top:40px;right:10px;background:rgba(8,11,20,.6);border-radius:50%;}
.orb3{width:160px;height:160px;top:-20px;left:-30px;background:conic-gradient(from 0deg,#1d4ed8,#0891b2,#1d4ed8);opacity:.5;animation:spin 18s linear infinite reverse;}
.orb4{width:100px;height:100px;top:60px;left:20px;background:rgba(8,11,20,.8);border-radius:50%;}
@keyframes spin{to{transform:rotate(360deg);}}
.splash-content{position:relative;z-index:1;padding:0 32px 60px;width:100%;}
.splash-logo{font-size:13px;font-weight:700;letter-spacing:4px;color:rgba(255,255,255,.4);margin-bottom:24px;}
.splash-title{font-size:42px;font-weight:800;line-height:1.1;margin-bottom:12px;letter-spacing:-1px;}
.splash-title span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.splash-sub{font-size:15px;color:var(--sub2);font-family:var(--font2);line-height:1.6;margin-bottom:40px;}
.splash-btn{width:100%;padding:18px;background:var(--grad);border-radius:var(--r2);font-size:16px;font-weight:700;color:#fff;letter-spacing:.5px;box-shadow:0 8px 32px rgba(59,130,246,.4);transition:transform .15s,box-shadow .15s;}
.splash-btn:active{transform:scale(.98);box-shadow:0 4px 16px rgba(59,130,246,.3);}
.splash-dots{display:flex;gap:6px;justify-content:center;margin-bottom:24px;}
.dot{width:6px;height:6px;border-radius:3px;background:var(--sub);}
.dot.active{width:20px;background:var(--grad);background:var(--a1);}
@keyframes fadeOut{to{opacity:0;pointer-events:none;}}
.splash-exit{animation:fadeOut .4s ease forwards;}

/* ── Page wrapper ────────────────────────────────────── */
.page{padding:0 16px 20px;min-height:100%;}
.page-hidden{display:none!important;}

/* ── Header ──────────────────────────────────────────── */
.pg-header{padding:18px 0 8px;display:flex;justify-content:space-between;align-items:flex-start;}
.pg-greeting{font-size:12px;color:var(--sub);letter-spacing:.5px;margin-bottom:2px;}
.pg-title{font-size:24px;font-weight:800;letter-spacing:-.5px;}
.pg-title span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.log-fab{background:var(--grad);border:none;border-radius:14px;padding:10px 18px;color:#fff;font-size:13px;font-weight:700;box-shadow:0 4px 20px rgba(59,130,246,.35);display:flex;align-items:center;gap:6px;transition:transform .15s;}
.log-fab:active{transform:scale(.96);}

/* ── Hero Card ───────────────────────────────────────── */
.hero-card{background:var(--grad2);border-radius:var(--r2);padding:24px;margin-bottom:16px;position:relative;overflow:hidden;}
.hero-card::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06);top:-60px;right:-40px;}
.hero-card::after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.04);bottom:-30px;right:40px;}
.hero-label{font-size:11px;font-weight:600;letter-spacing:2px;color:rgba(255,255,255,.6);margin-bottom:4px;}
.hero-pnl{font-size:44px;font-weight:900;letter-spacing:-2px;color:#fff;margin-bottom:4px;}
.hero-sub{font-size:12px;color:rgba(255,255,255,.6);}
.hero-badge{position:absolute;top:24px;right:24px;background:rgba(255,255,255,.15);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;color:#fff;backdrop-filter:blur(10px);}
.hero-chart{margin-top:16px;height:80px;position:relative;z-index:1;}

/* ── Stat Grid ───────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;backdrop-filter:blur(10px);}
.stat-card-label{font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--sub);margin-bottom:6px;}
.stat-card-val{font-size:22px;font-weight:800;letter-spacing:-.5px;}
.stat-card-sub{font-size:11px;color:var(--sub);margin-top:2px;}

/* ── Section ─────────────────────────────────────────── */
.section{margin-bottom:16px;}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.section-title{font-size:13px;font-weight:700;letter-spacing:1px;color:var(--sub2);}
.section-link{font-size:12px;color:var(--a1);font-weight:600;}

/* ── Streak Banner ───────────────────────────────────── */
.streak-banner{border-radius:var(--r);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border:1px solid;}
.streak-left .slabel{font-size:10px;letter-spacing:1.5px;font-weight:600;margin-bottom:4px;}
.streak-val{font-size:26px;font-weight:900;}
.streak-right{text-align:right;}
.streak-right .slabel{font-size:10px;color:var(--sub);letter-spacing:1px;margin-bottom:4px;}
.streak-right .svals{font-size:14px;font-weight:700;}

/* ── Chart Card ──────────────────────────────────────── */
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:18px;margin-bottom:16px;}
.chart-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.chart-title{font-size:14px;font-weight:700;}
.chart-wrap{position:relative;}

/* ── Trade Items ─────────────────────────────────────── */
.trade-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;cursor:pointer;transition:background .2s,border-color .2s;display:flex;justify-content:space-between;align-items:center;border-left:3px solid;}
.trade-card:active{background:var(--card2);}
.trade-left{}
.trade-pair{font-size:16px;font-weight:800;margin-bottom:4px;}
.trade-badges{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:4px;}
.badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.3px;}
.bdg-long{background:rgba(16,185,129,.2);color:var(--green);}
.bdg-short{background:rgba(239,68,68,.2);color:var(--red);}
.bdg-blue{background:rgba(59,130,246,.15);color:#60a5fa;}
.bdg-amber{background:rgba(245,158,11,.15);color:var(--amber);}
.trade-meta{font-size:10px;color:var(--sub);}
.trade-right{text-align:right;flex-shrink:0;margin-left:12px;}
.trade-pnl{font-size:20px;font-weight:900;margin-bottom:2px;}
.trade-rr{font-size:11px;color:var(--sub);}

/* ── Filter Chips ────────────────────────────────────── */
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.fchip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:11px;font-weight:600;color:var(--sub);white-space:nowrap;transition:all .2s;}
.fchip.active{background:var(--a1);border-color:var(--a1);color:#fff;}

/* ── Calendar ────────────────────────────────────────── */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.cal-month{font-size:18px;font-weight:800;}
.cal-nav{background:var(--card2);border:none;width:34px;height:34px;border-radius:10px;color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px;}
.cal-dow{font-size:10px;font-weight:700;color:var(--sub);text-align:center;padding:4px 0;letter-spacing:.5px;}
.cal-day{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .2s;position:relative;}
.cal-day.empty{background:none;border-color:transparent;cursor:default;}
.cal-day.win{background:rgba(16,185,129,.25);border-color:rgba(16,185,129,.4);color:var(--green);}
.cal-day.loss{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.35);color:var(--red);}
.cal-day.be{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.3);color:var(--amber);}
.cal-day.today{border-color:var(--a1);color:var(--a1);}
.cal-day.multi::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7;}
.cal-legend{display:flex;gap:14px;justify-content:center;margin-bottom:16px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub);}
.leg-dot{width:10px;height:10px;border-radius:3px;}
.cal-stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.cal-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
.cal-stat-val{font-size:20px;font-weight:800;margin-bottom:2px;}
.cal-stat-label{font-size:9px;color:var(--sub);letter-spacing:1px;font-weight:600;}

/* ── Report ──────────────────────────────────────────── */
.grade-card{border-radius:var(--r2);padding:24px;text-align:center;margin-bottom:16px;border:1px solid;position:relative;overflow:hidden;}
.grade-letter{font-size:80px;font-weight:900;line-height:1;}
.grade-desc{font-size:12px;color:var(--sub2);margin-top:6px;}
.strat-item{margin-bottom:14px;}
.strat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:12px;}
.strat-name{font-weight:700;}
.strat-meta{display:flex;gap:10px;color:var(--sub);}
.prog-track{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.disc-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.disc-row:last-child{border-bottom:none;}
.disc-label{font-size:13px;font-weight:600;}
.disc-pct{font-size:15px;font-weight:800;}
.insight-card{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:var(--r);padding:16px;margin-bottom:10px;}
.insight-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0;}
.insight-label{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--a1);}
.insight-sub{font-size:10px;color:var(--sub);margin-top:1px;}
.insight-text{font-size:12px;line-height:1.8;color:var(--sub2);margin-top:12px;white-space:pre-wrap;}

/* ── Bottom Sheet ────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;flex-direction:column;justify-content:flex-end;max-width:430px;margin:0 auto;backdrop-filter:blur(4px);}
.sheet{background:var(--bg2);border-radius:28px 28px 0 0;padding:8px 20px 20px;max-height:92vh;overflow-y:auto;border-top:1px solid var(--border2);}
.sheet-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.sheet-title{font-size:20px;font-weight:800;}
.close-btn{width:34px;height:34px;border-radius:10px;background:var(--card2);border:none;color:var(--sub2);font-size:18px;display:flex;align-items:center;justify-content:center;}

/* ── Form ────────────────────────────────────────────── */
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--sub);margin-bottom:5px;}
.fi{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--text);font-size:14px;font-family:var(--font);transition:border-color .2s;}
.fi:focus{border-color:rgba(59,130,246,.5);}
.fi-sel{-webkit-appearance:none;}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pnl-box{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;padding:13px 14px;font-size:18px;font-weight:800;}
.dir-grp{display:flex;gap:8px;}
.dir-btn{flex:1;padding:13px;border-radius:12px;font-size:14px;font-weight:700;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--sub);transition:all .2s;}
.dir-btn.long.sel{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.5);color:var(--green);}
.dir-btn.short.sel{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:var(--red);}
.chip-wrap{display:flex;gap:6px;flex-wrap:wrap;}
.fc{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:20px;padding:7px 13px;font-size:11px;font-weight:600;color:var(--sub);transition:all .2s;cursor:pointer;}
.fc.sel{background:var(--a1);border-color:var(--a1);color:#fff;}
.tog-grp{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tog{border-radius:12px;padding:13px;text-align:center;border:1px solid var(--border);background:rgba(255,255,255,.03);cursor:pointer;transition:all .2s;}
.tog.on{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.4);}
.tog-ico{font-size:22px;margin-bottom:3px;}
.tog-lbl{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--sub);}
.submit-btn{width:100%;padding:17px;background:var(--grad);border-radius:16px;font-size:15px;font-weight:800;color:#fff;letter-spacing:.5px;box-shadow:0 8px 32px rgba(59,130,246,.3);margin-top:4px;transition:transform .15s;}
.submit-btn:active{transform:scale(.98);}

/* ── Detail Sheet ────────────────────────────────────── */
.det-pnl{font-size:48px;font-weight:900;letter-spacing:-2px;margin-bottom:20px;}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.det-cell{background:rgba(255,255,255,.04);border-radius:12px;padding:12px;}
.det-cell-label{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--sub);margin-bottom:3px;}
.det-cell-val{font-size:13px;font-weight:700;}
.det-block{background:rgba(255,255,255,.04);border-radius:12px;padding:14px;margin-bottom:10px;}
.det-block-label{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--sub);margin-bottom:6px;}
.det-block-text{font-size:13px;line-height:1.7;color:var(--sub2);}
.det-block.err{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);}
.det-block.err .det-block-label{color:var(--red);}
.det-actions{display:flex;gap:8px;margin-top:16px;}
.btn-edit{flex:1;padding:14px;background:var(--grad);border-radius:12px;font-size:14px;font-weight:700;color:#fff;}
.btn-del{flex:1;padding:14px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:12px;font-size:14px;font-weight:700;color:var(--red);}

/* ── Settings ────────────────────────────────────────── */
.set-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;}
.set-card-title{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--sub);margin-bottom:12px;}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.set-row:last-child{border-bottom:none;}
.set-row-label{font-size:14px;font-weight:600;}
.set-row-val{font-size:12px;color:var(--sub);}
.set-btn{width:100%;padding:14px;border-radius:12px;font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px;}
.set-btn-grad{background:var(--grad);color:#fff;}
.set-btn-card{background:var(--card2);border:1px solid var(--border);color:var(--text);}
.set-btn-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:var(--red);}

/* ── Empty State ─────────────────────────────────────── */
.empty{text-align:center;padding:50px 20px;}
.empty-ico{font-size:52px;margin-bottom:14px;}
.empty-title{font-size:18px;font-weight:800;margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--sub);font-family:var(--font2);}

/* ── Animations ──────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-up{animation:fadeUp .4s ease forwards;}
.stagger1{animation-delay:.05s;}
.stagger2{animation-delay:.1s;}
.stagger3{animation-delay:.15s;}
.stagger4{animation-delay:.2s;}

/* ── Util ────────────────────────────────────────────── */
.green{color:var(--green);}
.red{color:var(--red);}
.amber{color:var(--amber);}
.grad-text{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.w100{width:100%;}
.mb8{margin-bottom:8px;}
.mb12{margin-bottom:12px;}
.mb16{margin-bottom:16px;}
</style>
</head>
<body>

<!-- ── Splash ────────────────────────────────────────── -->
<div id="splash">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>
  <div class="splash-content">
    <div class="splash-dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="splash-logo">TRADEFLOW</div>
    <div class="splash-title">Track every<br><span>winning trade.</span></div>
    <div class="splash-sub">Professional journal to analyze performance, enforce discipline and grow your edge.</div>
    <button class="splash-btn" onclick="startApp()">Get Started →</button>
  </div>
</div>

<!-- ── App ───────────────────────────────────────────── -->
<div id="app" style="display:none">
  <div id="screen">

        </div>
        <button class="log-fab" onclick="openForm()">

  </div>

  <!-- Nav -->
  <nav id="nav">

    </button>
    <button class="nav-item" id="ni-trades" onclick="nav('trades')">
      <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>Trades
    </button>
    <button class="nav-item" id="ni-cal" onclick="nav('cal')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendar
    </button>
    <button class="nav-item" id="ni-report" onclick="nav('report')">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Report
    </button>
  </nav>
</div>

<!-- ── Overlays (dynamically injected) ──────────────── -->
<div id="overlay-root"></div>

<script>
// ════════════════════════════════════════════════════
// Constants
// ════════════════════════════════════════════════════
const STRATS=['Breakout','Reversal','Trend Follow','Scalp','Supply/Demand','Order Block','VWAP','Vol Profile','S&R','Other'];
const PAIRS=['BTCUSD','ETHUSD','XAUUSD','EUR/USD','GBP/USD','NAS100','SPX500','Other'];
const SESSIONS=['London','New York','Asia','LN-NY Overlap','Other'];
const EMOTIONS=['Calm','Confident','FOMO','Revenge','Anxious','Greedy','Disciplined'];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

// ════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════
let trades=[], currentView='dash', activeChart={}, calMonth=new Date(), formData={}, editId=null;

function save(){try{localStorage.setItem('tf_trades',JSON.stringify(trades));}catch{}}
function load(){try{trades=JSON.parse(localStorage.getItem('tf_trades')||'[]');}catch{trades=[];}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function fmt(n){return n>=0?'+$'+Math.abs(n).toFixed(2):'-$'+Math.abs(n).toFixed(2);}
function fmtPlain(n){return n>=0?'+$'+n.toFixed(2):'-$'+Math.abs(n).toFixed(2);}
function clr(n){return n>0?'var(--green)':n<0?'var(--red)':'var(--amber)';}
function today(){return new Date().toISOString().slice(0,10);}

// ════════════════════════════════════════════════════
// Splash
// ════════════════════════════════════════════════════
function startApp(){
  const sp=document.getElementById('splash');
  sp.classList.add('splash-exit');
  setTimeout(()=>{sp.style.display='none';document.getElementById('app').style.display='flex';},400);
  load(); renderAll();
}

// ════════════════════════════════════════════════════
// Navigation
// ════════════════════════════════════════════════════
function nav(v){
  if(currentView===v)return;
  document.getElementById('pg-'+currentView).classList.add('page-hidden');
  document.getElementById('ni-'+currentView).classList.remove('active');
  currentView=v;
  document.getElementById('pg-'+v).classList.remove('page-hidden');
  document.getElementById('ni-'+v).classList.add('active');
  if(v==='dash')renderDash();
  if(v==='trades')renderTrades();
  if(v==='cal')renderCal();
  if(v==='report')renderReport();
  document.getElementById('screen').scrollTop=0;
}

function renderAll(){renderDash();renderTrades();renderCal();renderReport();}

// ════════════════════════════════════════════════════
// Analytics
// ════════════════════════════════════════════════════
function compute(ts){
  if(!ts.length)return null;
  const s=[...ts].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const wins=s.filter(t=>t.pnl>0), losses=s.filter(t=>t.pnl<0), be=s.filter(t=>t.pnl===0);
  const totalPnl=s.reduce((a,t)=>a+t.pnl,0);
  const winRate=(wins.length/s.length)*100;
  const avgWin=wins.length?wins.reduce((a,t)=>a+t.pnl,0)/wins.length:0;
  const avgLoss=losses.length?losses.reduce((a,t)=>a+t.pnl,0)/losses.length:0;
  const rrTs=s.filter(t=>t.rr>0);
  const avgRR=rrTs.length?rrTs.reduce((a,t)=>a+t.rr,0)/rrTs.length:0;
  const pf=losses.length?Math.abs(wins.reduce((a,t)=>a+t.pnl,0)/losses.reduce((a,t)=>a+t.pnl,0)):999;
  const riskPct=(s.filter(t=>t.riskF).length/s.length)*100;
  const stratPct=(s.filter(t=>t.stratF).length/s.length)*100;

  let run=0,peak=0,maxDD=0;
  const equity=[],dd=[];
  s.forEach(t=>{
    run+=t.pnl; equity.push({x:t.date.slice(5),y:parseFloat(run.toFixed(2))});
    if(run>peak)peak=run;
    const d=peak>0?((run-peak)/peak)*100:0;
    if(d<maxDD)maxDD=d;
    dd.push({x:t.date.slice(5),y:parseFloat(d.toFixed(2))});
  });

  let mxW=0,mxL=0,cW=0,cL=0;
  s.forEach(t=>{if(t.pnl>0){cW++;cL=0;if(cW>mxW)mxW=cW;}else if(t.pnl<0){cL++;cW=0;if(cL>mxL)mxL=cL;}});
  const last=s[s.length-1];
  const curStreak=last?.pnl>0?cW:last?.pnl<0?-cL:0;

  const mmap={};
  s.forEach(t=>{const m=t.date.slice(0,7);mmap[m]=(mmap[m]||0)+t.pnl;});
  const monthly=Object.entries(mmap).map(([m,p])=>({x:m.slice(5),y:parseFloat(p.toFixed(2))}));

  const dmap={Mon:0,Tue:0,Wed:0,Thu:0,Fri:0};
  s.forEach(t=>{const d=DAYS[new Date(t.date).getDay()];if(dmap[d]!==undefined)dmap[d]+=t.pnl;});
  const byDay=Object.entries(dmap).map(([d,p])=>({x:d,y:parseFloat(p.toFixed(2))}));

  const smap={};
  s.forEach(t=>{if(!smap[t.strat])smap[t.strat]={w:0,l:0,pnl:0};if(t.pnl>0)smap[t.strat].w++;else if(t.pnl<0)smap[t.strat].l++;smap[t.strat].pnl+=t.pnl;});
  const byStrat=Object.entries(smap).map(([n,v])=>({name:n,...v,wr:v.w+v.l>0?((v.w/(v.w+v.l))*100):0})).sort((a,b)=>b.pnl-a.pnl);

  return{
    total:s.length,wins:wins.length,losses:losses.length,be:be.length,
    totalPnl,winRate,avgWin,avgLoss,avgRR,pf,riskPct,stratPct,
    equity,dd,maxDD,monthly,byDay,byStrat,mxW,mxL,curStreak,
    best:s.reduce((a,t)=>t.pnl>a.pnl?t:a),
    worst:s.reduce((a,t)=>t.pnl<a.pnl?t:a)
  };
}

// ════════════════════════════════════════════════════
// Dashboard
// ════════════════════════════════════════════════════
function renderDash(){
  destroyCharts();
  const el=document.getElementById('dash-content');
  const a=compute(trades);
  if(!a){el.innerHTML=`<div class="empty fade-up"><div class="empty-ico">📈</div><div class="empty-title">Welcome to TradeFlow</div><div class="empty-sub">Tap Log Trade to record your first trade and start building your edge.</div></div>`;return;}
  const scColor=a.curStreak>0?'var(--green)':a.curStreak<0?'var(--red)':'var(--sub)';
  const scBg=a.curStreak>0?'rgba(16,185,129,.08)':a.curStreak<0?'rgba(239,68,68,.07)':'rgba(255,255,255,.03)';
  const scBorder=a.curStreak>0?'rgba(16,185,129,.3)':a.curStreak<0?'rgba(239,68,68,.25)':'var(--border)';
  const todayTrades=trades.filter(t=>t.date===today());
  const todayPnl=todayTrades.reduce((a,t)=>a+t.pnl,0);

  el.innerHTML=`
  <div class="hero-card fade-up">
    <div class="hero-label">NET P&amp;L</div>
    <div class="hero-pnl">${fmtPlain(a.totalPnl)}</div>
    <div class="hero-sub">${a.total} trades · ${a.winRate.toFixed(1)}% win rate</div>
    ${todayTrades.length?`<div class="hero-badge">Today ${fmt(todayPnl)}</div>`:''}
    <div class="hero-chart"><canvas id="heroChart" height="80"></canvas></div>
  </div>

  <div class="streak-banner fade-up stagger1" style="background:${scBg};border-color:${scBorder}">
    <div class="streak-left">
      <div class="slabel" style="color:${scColor}">CURRENT STREAK</div>
      <div class="streak-val" style="color:${scColor}">${a.curStreak>0?'🔥 '+a.curStreak+'W':a.curStreak<0?'❄️ '+Math.abs(a.curStreak)+'L':'—'}</div>
    </div>
    <div class="streak-right">
      <div class="slabel">BEST / WORST STREAK</div>
      <div class="svals"><span class="green">${a.mxW}W</span> &nbsp;/&nbsp; <span class="red">${a.mxL}L</span></div>
    </div>
  </div>

  <div class="stat-grid fade-up stagger2">
    <div class="stat-card"><div class="stat-card-label">WIN RATE</div><div class="stat-card-val" style="color:${a.winRate>=50?'var(--green)':'var(--red)'}">${a.winRate.toFixed(1)}%</div><div class="stat-card-sub">${a.wins}W / ${a.losses}L</div></div>
    <div class="stat-card"><div class="stat-card-label">PROFIT FACTOR</div><div class="stat-card-val" style="color:${a.pf>=1.5?'var(--green)':a.pf>=1?'var(--amber)':'var(--red)'}">${a.pf===999?'∞':a.pf.toFixed(2)}</div><div class="stat-card-sub">Expectancy</div></div>
    <div class="stat-card"><div class="stat-card-label">AVG R:R</div><div class="stat-card-val" style="color:${a.avgRR>=1.5?'var(--green)':'var(--amber)'}">${a.avgRR.toFixed(2)}R</div><div class="stat-card-sub">Per trade</div></div>
    <div class="stat-card"><div class="stat-card-label">MAX DRAWDOWN</div><div class="stat-card-val" style="color:${a.maxDD<-20?'var(--red)':'var(--amber)'}">${a.maxDD.toFixed(1)}%</div><div class="stat-card-sub">From peak</div></div>
    <div class="stat-card"><div class="stat-card-label">AVG WIN</div><div class="stat-card-val green">$${a.avgWin.toFixed(2)}</div><div class="stat-card-sub">Per winning trade</div></div>
    <div class="stat-card"><div class="stat-card-label">AVG LOSS</div><div class="stat-card-val red">-$${Math.abs(a.avgLoss).toFixed(2)}</div><div class="stat-card-sub">Per losing trade</div></div>
  </div>

  ${a.best?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px" class="fade-up stagger3 mb16">
    <div style="background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.2);border-radius:16px;padding:14px"><div class="stat-card-label" style="color:var(--green)">BEST TRADE</div><div style="font-size:20px;font-weight:900;color:var(--green);margin:4px 0">${fmt(a.best.pnl)}</div><div style="font-size:10px;color:var(--sub)">${a.best.pair} · ${a.best.strat}</div></div>
    <div style="background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);border-radius:16px;padding:14px"><div class="stat-card-label" style="color:var(--red)">WORST TRADE</div><div style="font-size:20px;font-weight:900;color:var(--red);margin:4px 0">${fmt(a.worst.pnl)}</div><div style="font-size:10px;color:var(--sub)">${a.worst.pair} · ${a.worst.strat}</div></div>
  </div>`:''}

  <div class="chart-card fade-up stagger4">
    <div class="chart-card-header"><div class="chart-title">W / L Breakdown</div><div style="font-size:12px;color:var(--sub)">${a.total} trades</div></div>
    <div style="height:8px;border-radius:4px;overflow:hidden;display:flex;margin-bottom:10px">
      <div style="flex:${a.wins};background:var(--green)"></div>
      <div style="flex:${a.be};background:var(--amber)"></div>
      <div style="flex:${a.losses};background:var(--red)"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px"><span class="green">✓ ${a.wins} Wins</span>${a.be?`<span class="amber">~ ${a.be} BE</span>`:''}<span class="red">✗ ${a.losses} Losses</span></div>
  </div>`;

  setTimeout(()=>initHeroChart(a),60);
}

function initHeroChart(a){
  const c=document.getElementById('heroChart');
  if(!c||!a)return;
  destroyChart('hero');
  const grad=c.getContext('2d').createLinearGradient(0,0,0,80);
  grad.addColorStop(0,'rgba(59,130,246,.35)');
  grad.addColorStop(1,'rgba(59,130,246,0)');
  activeChart.hero=new Chart(c,{type:'line',data:{labels:a.equity.map(p=>p.x),datasets:[{data:a.equity.map(p=>p.y),borderColor:'rgba(255,255,255,.9)',borderWidth:2,fill:true,backgroundColor:grad,pointRadius:0,tension:.4}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:800},plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false,grid:{display:false}}}}});
}

// ════════════════════════════════════════════════════
// Trades Page
// ════════════════════════════════════════════════════
function renderTrades(filter='All'){
  const el=document.getElementById('trades-content');
  const chips=['All',...STRATS].map(s=>`<button class="fchip ${filter===s?'active':''}" onclick="renderTrades('${s}')">${s}</button>`).join('');
  const ft=filter==='All'?trades:trades.filter(t=>t.strat===filter);
  const sorted=[...ft].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!sorted.length){el.innerHTML=`<div class="filter-row">${chips}</div><div class="empty"><div class="empty-ico">📋</div><div class="empty-title">No trades yet</div><div class="empty-sub">Start logging your trades to build your edge.</div></div>`;return;}
  const items=sorted.map(t=>`
    <div class="trade-card" style="border-left-color:${clr(t.pnl)}" onclick="openDetail('${t.id}')">
      <div class="trade-left">
        <div class="trade-pair">${t.pair}</div>
        <div class="trade-badges">
          <span class="badge ${t.dir==='Long'?'bdg-long':'bdg-short'}">${t.dir==='Long'?'▲':'▼'} ${t.dir}</span>
          ${t.riskF?'<span class="badge bdg-blue">✓ Risk</span>':''}
          ${t.stratF?'<span class="badge bdg-blue">✓ Strat</span>':''}
          ${t.emotion?`<span class="badge bdg-amber">${t.emotion}</span>`:''}
        </div>
        <div class="trade-meta">${t.date} · ${t.strat}${t.session?' · '+t.session:''}</div>
      </div>
      <div class="trade-right">
        <div class="trade-pnl" style="color:${clr(t.pnl)}">${fmt(t.pnl)}</div>
        ${t.rr?`<div class="trade-rr">${t.rr}R</div>`:''}
      </div>
    </div>`).join('');
  el.innerHTML=`<div class="filter-row">${chips}</div>${items}`;
}

// ════════════════════════════════════════════════════
// Calendar
// ════════════════════════════════════════════════════
function renderCal(){
  const el=document.getElementById('cal-content');
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const todayStr=today();

  // Build day map
  const dayMap={};
  trades.forEach(t=>{
    const d=t.date;
    if(!dayMap[d])dayMap[d]={pnl:0,count:0};
    dayMap[d].pnl+=t.pnl; dayMap[d].count++;
  });

  // Streak calc
  const a=compute(trades);
  const streak=a?a.curStreak:0;
  document.getElementById('cal-streak-top').innerHTML=streak?`${streak>0?'🔥':'❄️'} ${Math.abs(streak)} streak`:'';

  let cells='';
  for(let i=0;i<firstDay;i++)cells+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const info=dayMap[ds];
    let cls='cal-day';
    if(ds===todayStr)cls+=' today';
    if(info){
      if(info.pnl>0)cls+=' win';
      else if(info.pnl<0)cls+=' loss';
      else cls+=' be';
      if(info.count>1)cls+=' multi';
    }
    cells+=`<div class="${cls}" onclick="calDayClick('${ds}')">${d}</div>`;
  }

  // Month stats
  const mTrades=trades.filter(t=>t.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));
  const mWins=mTrades.filter(t=>t.pnl>0).length;
  const mLoss=mTrades.filter(t=>t.pnl<0).length;
  const mPnl=mTrades.reduce((a,t)=>a+t.pnl,0);

  el.innerHTML=`
  <div class="chart-card">
    <div class="cal-header">
      <button class="cal-nav" onclick="calNav(-1)">‹</button>
      <div class="cal-month">${MONTHS[m]} ${y}</div>
      <button class="cal-nav" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-grid">
      ${DAYS.map(d=>`<div class="cal-dow">${d.slice(0,1)}</div>`).join('')}
      ${cells}
    </div>
    <div class="cal-legend">
      <div class="leg-item"><div class="leg-dot" style="background:rgba(16,185,129,.5)"></div>Win</div>
      <div class="leg-item"><div class="leg-dot" style="background:rgba(239,68,68,.5)"></div>Loss</div>
      <div class="leg-item"><div class="leg-dot" style="background:rgba(245,158,11,.5)"></div>BE</div>
    </div>
  </div>
  <div class="cal-stats-grid mb16">
    <div class="cal-stat"><div class="cal-stat-val green">${mWins}</div><div class="cal-stat-label">WINS</div></div>
    <div class="cal-stat"><div class="cal-stat-val red">${mLoss}</div><div class="cal-stat-label">LOSSES</div></div>
    <div class="cal-stat"><div class="cal-stat-val" style="color:${clr(mPnl)}">${mPnl>=0?'+':''}$${Math.abs(mPnl).toFixed(0)}</div><div class="cal-stat-label">MONTH P&L</div></div>
  </div>
  <div id="cal-day-trades"></div>`;
}

function calNav(dir){
  calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+dir,1);
  renderCal();
}

function calDayClick(ds){
  const dt=trades.filter(t=>t.date===ds);
  if(!dt.length)return;
  const el=document.getElementById('cal-day-trades');
  el.innerHTML=`<div class="section-header" style="margin-bottom:10px"><div class="section-title">${ds}</div></div>`+
    dt.map(t=>`<div class="trade-card" style="border-left-color:${clr(t.pnl)}" onclick="openDetail('${t.id}')">
      <div class="trade-left"><div class="trade-pair">${t.pair}</div><div class="trade-meta">${t.strat}</div></div>
      <div class="trade-right"><div class="trade-pnl" style="color:${clr(t.pnl)}">${fmt(t.pnl)}</div></div>
    </div>`).join('');
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ════════════════════════════════════════════════════
// Report
// ════════════════════════════════════════════════════
function renderReport(){
  destroyCharts();
  const el=document.getElementById('report-content');
  const a=compute(trades);
  if(!a){el.innerHTML=`<div class="empty"><div class="empty-ico">📊</div><div class="empty-title">No data yet</div><div class="empty-sub">Log at least one trade to see your report.</div></div>`;return;}
  const grade=a.winRate>=60&&a.pf>=1.5&&a.avgRR>=1.5?'A':a.winRate>=50&&a.pf>=1.2?'B':a.winRate>=45&&a.pf>=1?'C':'D';
  const gc={A:'var(--green)',B:'var(--a1)',C:'var(--amber)',D:'var(--red)'}[grade];
  const gd={A:'Elite performance — keep it up 🔥',B:'Good — minor improvements needed',C:'Average — focus on discipline',D:'Needs work — review your process'}[grade];
  const gcBg={A:'rgba(16,185,129,.06)',B:'rgba(59,130,246,.06)',C:'rgba(245,158,11,.06)',D:'rgba(239,68,68,.06)'}[grade];
  const gcBorder={A:'rgba(16,185,129,.25)',B:'rgba(59,130,246,.2)',C:'rgba(245,158,11,.2)',D:'rgba(239,68,68,.2)'}[grade];

  const stratRows=a.byStrat.slice(0,6).map(s=>`
    <div class="strat-item">
      <div class="strat-row">
        <span class="strat-name">${s.name}</span>
        <div class="strat-meta"><span>${s.wr.toFixed(0)}% WR</span><span style="color:${clr(s.pnl)}">${fmt(s.pnl)}</span></div>
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:${s.wr}%;background:${s.wr>=50?'var(--green)':'var(--red)'}"></div></div>
    </div>`).join('');

  el.innerHTML=`
  <div class="grade-card fade-up" style="background:${gcBg};border-color:${gcBorder}">
    <div class="grade-letter" style="color:${gc}">${grade}</div>
    <div class="grade-desc">${gd}</div>
  </div>

  <div class="chart-card fade-up stagger1">
    <div class="chart-card-header"><div class="chart-title">Equity Curve</div></div>
    <div class="chart-wrap" style="height:150px"><canvas id="eqChart"></canvas></div>
  </div>

  <div class="chart-card fade-up stagger2">
    <div class="chart-card-header"><div class="chart-title">Drawdown</div><div style="font-size:12px;color:var(--red)">${a.maxDD.toFixed(1)}% max</div></div>
    <div class="chart-wrap" style="height:110px"><canvas id="ddChart"></canvas></div>
  </div>

  <div class="chart-card fade-up stagger3">
    <div class="chart-card-header"><div class="chart-title">Monthly P&amp;L</div></div>
    <div class="chart-wrap" style="height:120px"><canvas id="monthChart"></canvas></div>
  </div>

  <div class="chart-card fade-up">
    <div class="chart-card-header"><div class="chart-title">Day of Week</div></div>
    <div class="chart-wrap" style="height:110px"><canvas id="dayChart"></canvas></div>
  </div>

  ${a.byStrat.length?`<div class="chart-card fade-up"><div class="chart-card-header"><div class="chart-title">Strategy Breakdown</div></div>${stratRows}</div>`:''}

  <div class="chart-card fade-up">
    <div class="chart-card-header"><div class="chart-title">Discipline</div></div>
    <div class="disc-row"><span class="disc-label">Risk Management</span><span class="disc-pct" style="color:var(--a1)">${a.riskPct.toFixed(0)}%</span></div>
    <div class="prog-track mb12"><div class="prog-fill" style="width:${a.riskPct}%;background:var(--a1)"></div></div>
    <div class="disc-row"><span class="disc-label">Strategy Adherence</span><span class="disc-pct" style="color:var(--green)">${a.stratPct.toFixed(0)}%</span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${a.stratPct}%;background:var(--green)"></div></div>
  </div>

  <div class="insight-card fade-up">
    <div class="insight-header">
      <div><div class="insight-label">AI COACH ANALYSIS</div><div class="insight-sub">Requires internet · powered by Claude AI</div></div>
      <button class="log-fab" style="font-size:11px;padding:9px 14px" onclick="getAI()" id="ai-btn">Analyze</button>
    </div>
    <div class="insight-text" id="ai-out"></div>
  </div>`;

  setTimeout(()=>initReportCharts(a),80);
}

function initReportCharts(a){
  const co={responsive:true,maintainAspectRatio:false,animation:{duration:700},plugins:{legend:{display:false},tooltip:{backgroundColor:'#0d1221',titleFont:{family:'Outfit'},bodyFont:{family:'Outfit'},borderColor:'rgba(255,255,255,.1)',borderWidth:1}},scales:{x:{ticks:{color:'#64748b',font:{size:9,family:'Outfit'}},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#64748b',font:{size:9,family:'Outfit'}},grid:{color:'rgba(255,255,255,.04)'}}}};

  const eq=document.getElementById('eqChart');
  if(eq){
    destroyChart('eq');
    const g=eq.getContext('2d').createLinearGradient(0,0,0,150);
    g.addColorStop(0,'rgba(59,130,246,.3)');g.addColorStop(1,'rgba(59,130,246,0)');
    activeChart.eq=new Chart(eq,{type:'line',data:{labels:a.equity.map(p=>p.x),datasets:[{data:a.equity.map(p=>p.y),borderColor:'#3b82f6',borderWidth:2,fill:true,backgroundColor:g,pointRadius:0,tension:.4}]},options:{...co,scales:{...co.scales,y:{...co.scales.y,grid:{color:(ctx)=>ctx.tick.value===0?'rgba(255,255,255,.15)':'rgba(255,255,255,.04)'}}}}}});
  }

  const dd=document.getElementById('ddChart');
  if(dd){
    destroyChart('dd');
    const g2=dd.getContext('2d').createLinearGradient(0,0,0,110);
    g2.addColorStop(0,'rgba(239,68,68,.3)');g2.addColorStop(1,'rgba(239,68,68,0)');
    activeChart.dd=new Chart(dd,{type:'line',data:{labels:a.dd.map(p=>p.x),datasets:[{data:a.dd.map(p=>p.y),borderColor:'#ef4444',borderWidth:2,fill:true,backgroundColor:g2,pointRadius:0,tension:.4}]},options:co});
  }

  const mc=document.getElementById('monthChart');
  if(mc){destroyChart('mc');activeChart.mc=new Chart(mc,{type:'bar',data:{labels:a.monthly.map(p=>p.x),datasets:[{data:a.monthly.map(p=>p.y),backgroundColor:a.monthly.map(p=>p.y>=0?'rgba(16,185,129,.7)':'rgba(239,68,68,.7)'),borderRadius:6}]},options:co});}

  const dc=document.getElementById('dayChart');
  if(dc){destroyChart('dc');activeChart.dc=new Chart(dc,{type:'bar',data:{labels:a.byDay.map(p=>p.x),datasets:[{data:a.byDay.map(p=>p.y),backgroundColor:a.byDay.map(p=>p.y>=0?'rgba(16,185,129,.7)':'rgba(239,68,68,.7)'),borderRadius:6}]},options:co});}
}

function destroyChart(k){try{activeChart[k]?.destroy();delete activeChart[k];}catch{}}
function destroyCharts(){Object.keys(activeChart).forEach(destroyChart);}

// ════════════════════════════════════════════════════
// AI
// ════════════════════════════════════════════════════
async function getAI(){
  const a=compute(trades);if(!a)return;
  const btn=document.getElementById('ai-btn');
  const out=document.getElementById('ai-out');
  if(!btn||!out)return;
  btn.textContent='...';btn.disabled=true;
  out.textContent='';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:`You are a pro trading coach. Give 4-5 sharp, actionable bullet points based on this data.\n\nWin Rate: ${a.winRate.toFixed(1)}%\nProfit Factor: ${a.pf===999?'No losses':a.pf.toFixed(2)}\nAvg R:R: ${a.avgRR.toFixed(2)}\nMax Drawdown: ${a.maxDD.toFixed(1)}%\nAvg Win $${a.avgWin.toFixed(2)} / Avg Loss -$${Math.abs(a.avgLoss).toFixed(2)}\nTotal Trades: ${a.total}\nBest Streak: ${a.mxW}W / Worst: ${a.mxL}L\nRisk Mgmt: ${a.riskPct.toFixed(0)}%\nStrategy Adherence: ${a.stratPct.toFixed(0)}%\nBest strategy: ${a.byStrat[0]?.name||'N/A'}\n\nBe direct, specific, no fluff.`}]})});
    const d=await r.json();
    out.textContent=d.content?.[0]?.text||'No response.';
  }catch{out.textContent='Cannot connect. Check internet connection.';}
  btn.textContent='Analyze';btn.disabled=false;
}

// ════════════════════════════════════════════════════
// Trade Form
// ════════════════════════════════════════════════════
function openForm(trade=null){
  editId=trade?trade.id:null;
  formData=trade?{...trade}:{
    date:today(),pair:'BTCUSD',dir:'Long',entry:'',exit:'',size:'',
    sl:'',tp:'',pnl:'',rr:'',strat:STRATS[0],session:'',emotion:'Calm',
    riskF:true,stratF:true,notes:'',mistakes:''
  };
  injectOverlay(buildFormHTML());
}

function buildFormHTML(){
  const f=formData;
  const pairChips=PAIRS.map(p=>`<button class="fc ${f.pair===p?'sel':''}" onclick="fp('pair','${p}');rfc(this,'pair')">${p}</button>`).join('');
  const stratChips=STRATS.map(s=>`<button class="fc ${f.strat===s?'sel':''}" onclick="fp('strat','${s}');rfc(this,'strat')">${s}</button>`).join('');
  const sessOpts=SESSIONS.map(s=>`<option ${f.session===s?'selected':''}>${s}</option>`).join('');
  const emoOpts=EMOTIONS.map(e=>`<option ${f.emotion===e?'selected':''}>${e}</option>`).join('');
  const pc=f.pnl!==''?`color:${clr(parseFloat(f.pnl))}`:'color:var(--sub)';
  return `<div class="overlay" id="form-overlay" onclick="closeIfBg(event,'form-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">${editId?'Edit Trade':'Log Trade'}</div>
      <button class="close-btn" onclick="closeOverlay()">✕</button>
    </div>

    <div class="fg"><label>DATE</label><input class="fi" type="date" value="${f.date}" onchange="fp('date',this.value)"></div>

    <div class="fg"><label>PAIR</label><div class="chip-wrap">${pairChips}</div></div>

    <div class="fg"><label>DIRECTION</label><div class="dir-grp">
      <button class="dir-btn long ${f.dir==='Long'?'sel':''}" onclick="fp('dir','Long');this.classList.add('sel');this.nextElementSibling.classList.remove('sel');">▲ Long</button>
      <button class="dir-btn short ${f.dir==='Short'?'sel':''}" onclick="fp('dir','Short');this.classList.add('sel');this.previousElementSibling.classList.remove('sel');">▼ Short</button>
    </div></div>

    <div class="fg-row">
      <div class="fg"><label>ENTRY PRICE</label><input class="fi" type="number" step="any" placeholder="0.00" value="${f.entry}" oninput="fp('entry',this.value);autocalc()"></div>
      <div class="fg"><label>EXIT PRICE</label><input class="fi" type="number" step="any" placeholder="0.00" value="${f.exit}" oninput="fp('exit',this.value);autocalc()"></div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>POSITION SIZE</label><input class="fi" type="number" step="any" placeholder="0" value="${f.size}" oninput="fp('size',this.value);autocalc()"></div>
      <div class="fg"><label>P&amp;L (AUTO)</label><div class="pnl-box" id="pnl-disp" style="${pc}">${f.pnl!==''?fmt(parseFloat(f.pnl)||0):'—'}</div></div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>STOP LOSS</label><input class="fi" type="number" step="any" placeholder="0.00" value="${f.sl}" oninput="fp('sl',this.value);autocalc()"></div>
      <div class="fg"><label>R:R (AUTO)</label><div class="pnl-box" id="rr-disp" style="color:var(--amber)">${f.rr?f.rr+'R':'—'}</div></div>
    </div>
    <div class="fg"><label>TAKE PROFIT</label><input class="fi" type="number" step="any" placeholder="0.00" value="${f.tp}" oninput="fp('tp',this.value)"></div>

    <div class="fg"><label>STRATEGY</label><div class="chip-wrap">${stratChips}</div></div>

    <div class="fg-row">
      <div class="fg"><label>SESSION</label><select class="fi fi-sel" onchange="fp('session',this.value)"><option value="">Any</option>${sessOpts}</select></div>
      <div class="fg"><label>EMOTION</label><select class="fi fi-sel" onchange="fp('emotion',this.value)">${emoOpts}</select></div>
    </div>

    <div class="fg"><label>DISCIPLINE</label><div class="tog-grp">
      <div class="tog ${f.riskF?'on':''}" id="tog-risk" onclick="fp('riskF',!formData.riskF);this.classList.toggle('on');this.querySelector('.tog-ico').textContent=formData.riskF?'✅':'❌'"><div class="tog-ico">${f.riskF?'✅':'❌'}</div><div class="tog-lbl">RISK MGMT</div></div>
      <div class="tog ${f.stratF?'on':''}" id="tog-strat" onclick="fp('stratF',!formData.stratF);this.classList.toggle('on');this.querySelector('.tog-ico').textContent=formData.stratF?'✅':'❌'"><div class="tog-ico">${f.stratF?'✅':'❌'}</div><div class="tog-lbl">STRAT DISC.</div></div>
    </div></div>

    <div class="fg"><label>NOTES / SETUP</label><textarea class="fi" rows="3" placeholder="Why did you enter? What did you see?" oninput="fp('notes',this.value)">${f.notes}</textarea></div>
    <div class="fg"><label>MISTAKES / LESSONS</label><textarea class="fi" rows="3" placeholder="What went wrong? What will you improve?" oninput="fp('mistakes',this.value)">${f.mistakes}</textarea></div>

    <button class="submit-btn" onclick="submitTrade()">${editId?'SAVE CHANGES':'LOG TRADE ✓'}</button>
    <div style="height:16px"></div>
  </div></div>`;
}

function fp(k,v){formData[k]=v;}
function rfc(el,key){
  el.closest('.chip-wrap').querySelectorAll('.fc').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
}

function autocalc(){
  const e=parseFloat(formData.entry),x=parseFloat(formData.exit),s=parseFloat(formData.size),sl=parseFloat(formData.sl);
  if(e&&x&&s){
    const pnl=formData.dir==='Long'?(x-e)*s:(e-x)*s;
    formData.pnl=parseFloat(pnl.toFixed(2));
    const pd=document.getElementById('pnl-disp');
    if(pd){pd.textContent=fmt(formData.pnl);pd.style.color=clr(formData.pnl);}
    if(sl&&e!==sl){
      const risk=Math.abs(e-sl)*s,reward=Math.abs(x-e)*s;
      formData.rr=parseFloat((reward/risk).toFixed(2));
      const rd=document.getElementById('rr-disp');
      if(rd)rd.textContent=formData.rr+'R';
    }
  }
}

function submitTrade(){
  if(!formData.entry||!formData.exit||!formData.size){alert('Please fill Entry, Exit, and Size');return;}
  const t={...formData,id:editId||uid(),entry:parseFloat(formData.entry),exit:parseFloat(formData.exit),size:parseFloat(formData.size),pnl:parseFloat(formData.pnl)||0,rr:parseFloat(formData.rr)||0};
  if(editId)trades=trades.map(x=>x.id===editId?t:x);
  else trades=[t,...trades];
  save();closeOverlay();renderAll();
  nav(currentView);
}

// ════════════════════════════════════════════════════
// Trade Detail
// ════════════════════════════════════════════════════
function openDetail(id){
  const t=trades.find(x=>x.id===id);if(!t)return;
  const cells=[
    ['Date',t.date],['Strategy',t.strat],['Entry','$'+t.entry],['Exit','$'+t.exit],
    ['Size',t.size],['R:R',t.rr?t.rr+'R':'—'],['Session',t.session||'—'],['Emotion',t.emotion||'—'],
    ['Stop Loss',t.sl?'$'+t.sl:'—'],['Take Profit',t.tp?'$'+t.tp:'—'],
    ['Risk Mgmt',t.riskF?'✓ Yes':'✗ No'],['Strat Disc.',t.stratF?'✓ Yes':'✗ No'],
  ].map(([l,v])=>`<div class="det-cell"><div class="det-cell-label">${l}</div><div class="det-cell-val">${v}</div></div>`).join('');
  const html=`<div class="overlay" id="det-overlay" onclick="closeIfBg(event,'det-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="sheet-title">${t.pair}</span>
        <span class="badge ${t.dir==='Long'?'bdg-long':'bdg-short'}">${t.dir==='Long'?'▲':'▼'} ${t.dir}</span>
      </div>
      <button class="close-btn" onclick="closeOverlay()">✕</button>
    </div>
    <div class="det-pnl" style="color:${clr(t.pnl)}">${fmtPlain(t.pnl)}</div>
    <div class="det-grid">${cells}</div>
    ${t.notes?`<div class="det-block"><div class="det-block-label">NOTES</div><div class="det-block-text">${t.notes}</div></div>`:''}
    ${t.mistakes?`<div class="det-block err"><div class="det-block-label">MISTAKES</div><div class="det-block-text">${t.mistakes}</div></div>`:''}
    <div class="det-actions">
      <button class="btn-edit" onclick="closeOverlay();openForm(${JSON.stringify(t).replace(/"/g,'&quot;')})">✏️ Edit</button>
      <button class="btn-del" onclick="deleteTrade('${t.id}')">🗑 Delete</button>
    </div>
    <div style="height:16px"></div>
  </div></div>`;
  injectOverlay(html);
}

function deleteTrade(id){
  if(!confirm('Delete this trade?'))return;
  trades=trades.filter(t=>t.id!==id);
  save();closeOverlay();renderAll();nav(currentView);
}

// ════════════════════════════════════════════════════
// Overlay helpers
// ════════════════════════════════════════════════════
function injectOverlay(html){
  const root=document.getElementById('overlay-root');
  root.innerHTML=html;
}
function closeOverlay(){document.getElementById('overlay-root').innerHTML='';}
function closeIfBg(e,id){if(e.target.id===id)closeOverlay();}

// ════════════════════════════════════════════════════
// Service Worker (offline)
// ════════════════════════════════════════════════════
if('serviceWorker' in navigator){
  const sw=`
const C='tf-v3';
const PRE=['https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap','https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js'];
self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll(PRE).catch(()=>{}))));
self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res&&res.status===200){const clone=res.clone();caches.open(C).then(c=>c.put(e.request,clone));}return res;}).catch(()=>r))));
  `;
  const blob=new Blob([sw],{type:'application/javascript'});
  const url=URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).catch(()=>{});
}

// Init

load();
// Auto-skip splash if returning user
if(trades.length>0){
  setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    document.getElementById('app').style.display='flex';
    renderAll();
  },100);
}
</script>
